name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支上新的推送会取消仍在跑的旧流水线，避免排队堆积
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    # 单 job 超时。默认 360 分钟，卡住时会长时间占用 runner；
    # 15 分钟足够本项目的 validate / typecheck / test / build 全部跑完。
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Validate specs and changes
        run: |
          npx --yes @fission-ai/openspec@1 validate --specs
          npx --yes @fission-ai/openspec@1 validate --changes --strict

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build
